<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      background-color: #050608;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 68px;
    }
    /* Ambient Grid Pattern */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      z-index: 1;
    }
    /* Ambient Glows */
    .glow-top-left {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(40px);
      z-index: 1;
    }
    .glow-bottom-right {
      position: absolute;
      bottom: -120px;
      right: -80px;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(50px);
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }
    /* Top Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0e1117;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-family: ui-monospace, monospace;
    }
    .banner-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: #e4e4e7;
      border: 1px solid #d4d4d8;
      color: #000000;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Main Hero in Card */
    .hero-center {
      margin-top: 18px;
    }
    .main-title {
      font-size: 50px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: #ffffff;
    }
    .sub-title {
      margin-top: 10px;
      font-size: 21px;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: -0.3px;
    }

    /* Tool Grid Preview */
    .tools-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }
    .tool-pill {
      background: rgba(14, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tool-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-tag {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 7px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
    }

    /* Footer Row */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 18px;
    }
    .feature-list {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13px;
      color: #94a3b8;
      font-family: ui-monospace, monospace;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .platform-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #ffffff;
      font-family: ui-monospace, monospace;
    }
    .platform-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-top-left"></div>
  <div class="glow-bottom-right"></div>

  <div class="content">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand-wrap">
        <div class="brand-icon" style="background: transparent; padding: 0; width: 44px; height: 44px;">
          <img src="/home/gao/Projects/freevpn/public/logo.png" style="width: 44px; height: 44px; object-fit: contain;" alt="Logo" />
        </div>

          <circle cx="12" cy="12" r="10"/>
          <path d="m9 12 2 2 4-4"/>

    </div>

    <!-- Center Hero -->
    <div class="hero-center">

      <p class="sub-title">精选非盈利、开源与透明工具 · 杜绝国产流氓与实名钓鱼 · 翻墙小白安全手册</p>
    </div>

    <!-- Tools Preview Grid -->
    <div class="tools-preview">
      <div class="tool-pill">
        <span class="tool-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>

        </span>
        <span class="tool-tag">非盈利性机构</span>
      </div>
      <div class="tool-pill">
        <span class="tool-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
          FreeSocks
        </span>
        <span class="tool-tag">非盈利性机构</span>
      </div>
      <div class="tool-pill">
        <span class="tool-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/></svg>
          NthLink
        </span>
        <span class="tool-tag">非营利发起</span>
      </div>
      <div class="tool-pill">
        <span class="tool-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="10"/></svg>
          Tor Browser
        </span>
        <span class="tool-tag">洋葱路由/网桥</span>
      </div>
      <div class="tool-pill">
        <span class="tool-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5Z"/></svg>
          Proton VPN
        </span>
        <span class="tool-tag">非盈利基金会监督</span>
      </div>
      <div class="tool-pill">
        <span class="tool-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M22 12A10 10 0 1 1 12 2"/></svg>
          1.1.1.1 (WARP)
        </span>
        <span class="tool-tag">欧美上市公司</span>
      </div>
    </div>

    <!-- Bottom Features & Platforms -->
    <div class="bottom-bar">
      <div class="feature-list">
        <div class="feature-item">
          <span>✓</span> 零实名防钓鱼
        </div>
        <div class="feature-item">
          <span>✓</span> 国内免翻镜像
        </div>
        <div class="feature-item">
          <span>✓</span> 资助主体完全透明
        </div>
        <div class="feature-item">
          <span>✓</span> 附保姆级配置
        </div>
      </div>

      <div class="platform-chips">
        <span>支持全平台：</span>
        <span class="platform-chip">Android</span>
        <span class="platform-chip">iOS</span>
        <span class="platform-chip">Windows</span>
        <span class="platform-chip">macOS</span>
        <span class="platform-chip">Linux</span>
      </div>
    </div>
  </div>
</body>
</html>
